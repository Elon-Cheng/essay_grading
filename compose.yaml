services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: essay
      POSTGRES_USER: essay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U essay -d essay"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      INLINE_WORKER: "0"
      DATABASE_URL: postgresql://essay:${POSTGRES_PASSWORD}@db:5432/essay
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "worker.py"]
    environment:
      APP_ENV: production
      INLINE_WORKER: "0"
      DATABASE_URL: postgresql://essay:${POSTGRES_PASSWORD}@db:5432/essay
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      default:
        ipv4_address: 172.28.0.2
volumes:
  postgres_data:
  app_data:
  caddy_data:
  caddy_config:
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
