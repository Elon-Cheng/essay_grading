<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨评 · 账号登录</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/business.css"><link rel="stylesheet" href="/static/account.css"><script defer src="/static/login.js"></script></head><body class="auth-page"><main class="auth-card"><a class="brand" href="/login"><span class="brand-icon">墨</span><span>墨评<small>ESSAY STUDIO</small></span></a><h1 id="auth-title">登录工作空间</h1><p>管理个人作文，查看批改结果与操作记录。</p><div class="auth-tabs"><button type="button" class="selected" id="login-tab">登录</button><button type="button" id="register-tab">注册账号</button></div><form id="auth-form"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]{3,32}" placeholder="3–32 位字母、数字或下划线"><label for="password">密码</label><input id="password" name="password" autocomplete="current-password" type="password" required minlength="8" maxlength="128" placeholder="至少 8 位字符"><div id="confirm-field" hidden><label for="confirm">确认密码</label><input id="confirm" autocomplete="new-password" type="password" maxlength="128"></div><p id="auth-error" role="alert" hidden></p><button class="button primary" id="auth-submit">登录</button></form><small class="auth-note">账号资料与操作记录保存在当前服务器。</small></main></body></html>
