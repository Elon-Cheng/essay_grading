<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨评 · 套餐与账户</title><link rel="stylesheet" href="/static/saas.css"><script defer src="/static/manual-payments.js"></script><script defer src="/static/credit-payments.js?v=credits-v1"></script><script defer src="/static/saas.js?v=credits-v1"></script></head><body>
<header class="site-header"><a class="logo" href="/workspace"><span>墨</span> 墨评</a><nav aria-label="账户导航"><a href="/workspace">作文批改</a><a href="/pricing">套餐</a><a href="/account">我的账户</a><a href="/orders">订单记录</a><a id="admin-link" href="/admin" hidden>运营后台</a></nav><a id="session-link" href="/login">登录</a></header>
<main><div class="page-title"><div><span class="eyebrow">ESSAY STUDIO</span><h1 id="page-title">套餐与账户</h1><p id="page-subtitle"></p></div><button id="refresh" class="button secondary" type="button">刷新</button></div><p id="message" role="status" aria-live="polite" hidden></p><div id="content" aria-live="polite"><p class="muted">正在加载…</p></div></main>
<dialog id="checkout"><button class="close" id="close-checkout" aria-label="关闭支付窗口">×</button><h2>扫码支付</h2><p id="checkout-description"></p><img id="pay-qr" alt="支付收款码" width="240" height="240"><p id="pay-state" role="status"></p><p id="checkout-help" class="muted"></p><form id="payment-proof" hidden><label>付款人昵称<input name="payer" maxlength="80" required autocomplete="off"></label><label>微信或支付宝交易单号<input name="reference" minlength="6" maxlength="128" required autocomplete="off"></label><label>付款成功截图（最多 2 MB）<input name="file" type="file" accept="image/png,image/jpeg,image/webp" required></label><button class="button primary" type="submit">提交付款凭证，等待审核</button></form><button id="check-payment" class="button secondary">查询结果</button></dialog>
<footer>墨评 ESSAY STUDIO · 每一篇，都更进一步。</footer></body></html>
